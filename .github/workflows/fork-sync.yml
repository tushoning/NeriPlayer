name: 同步上游并发布 TV 版

# 干什么：
#   定时（每小时）去上游 cwuom/NeriPlayer 看**有没有发布新 Release**。
#   有新 Release → 把我方补丁叠到上游 master 上 → 编译电视包（aerial 签名）
#                → 发 Release → 把结果推回 main → 打 seen/<上游 Release 名> 标记。
#   没有新 Release → 定时触发时直接退出，不编译（上游 master 天天有提交也不管）。
#
#   手动触发（Run workflow）**总是出包**：不管有没有新 Release，都编一遍并发 Release。
#
#   为什么按 Release 而不是按提交：上游大约 3~5 天发一版，master 则天天动。
#   跟着 Release 走，出包节奏和上游一致，也不会把上游半成品带进来。
#
# 合规：Release 的 tag 打在「实际编译的那个 commit」上，GitHub 自动给 tag 附源码包，
#       满足 GPLv3 §6「分发二进制必须能拿到对应源码」。

on:
  schedule:
    # 每小时看一次上游 Release。没新 Release 时几秒就 exit，不编译，几乎零成本；
    # 跑得勤是为了对冲 GitHub schedule 的「best effort」——高峰期会延迟甚至整班跳过。
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write # 打 tag、发 Release、push 分支都要写权限

concurrency:
  group: fork-sync
  cancel-in-progress: false

env:
  UPSTREAM_REPO: https://github.com/cwuom/NeriPlayer.git
  UPSTREAM_API: https://api.github.com/repos/cwuom/NeriPlayer
  KEY_ALIAS: aerial
  APK_OUT: NeriPlayer-TV.apk
  # aerial 证书的 SHA-256（公开信息，不是密钥）。传错密钥 / 没生效签名都会在这里失败。
  CERT_SHA256: 4ca292129ad97359a262d5f5269e7fd7ef0287b33cd19f6e761dd671946581b5

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60 # 卡死时早失败，而不是拖到 GitHub 默认的 6 小时
    # 显式声明 token 权限，不依赖仓库的默认设置（否则推分支/建 Release 会 403）
    permissions:
      contents: write # 推 main、打 tag、建 Release
    steps:
      - name: 拉取本仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 需要完整历史：git am -3 要用到补丁的原始 blob
          submodules: recursive

      - name: 配置 git 身份
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 确保是完整仓库（不是浅克隆）
        run: |
          set -uo pipefail
          SHALLOW=$(git rev-parse --is-shallow-repository)
          echo "shallow=$SHALLOW"
          # 浅克隆的仓库 push 新 commit 会被 GitHub 拒绝（shallow update not allowed），
          # 这正是「tag 指向远端没有的 commit 时推不上去」的原因。
          if [ "$SHALLOW" = "true" ]; then
            echo "仓库是浅克隆，取消浅克隆……"
            git fetch --unshallow origin || true
            echo "处理后 shallow=$(git rev-parse --is-shallow-repository)"
          fi

      - name: 检查上游有没有新 Release
        id: up
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # ---------- 1. 上游最新的正式 Release（忽略草稿和预发布）----------
          # 「已处理过」靠 tag 记：seen/<上游 Release 名>，构建全流程跑完后才打。
          REL_TAG=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "$UPSTREAM_API/releases?per_page=30" \
            | python3 -c 'import json,sys; rs=json.load(sys.stdin); print(next((r["tag_name"] for r in rs if not r.get("draft") and not r.get("prerelease")), ""))') \
            || { echo "::error::读取上游 Release 列表失败"; exit 1; }
          echo "release_tag=$REL_TAG" >> "$GITHUB_OUTPUT"

          # tag 可能没被 checkout 拉全（fetch-depth: 0 通常够，这里再兜一次）
          git fetch --quiet origin '+refs/tags/seen/*:refs/tags/seen/*' 2>/dev/null || true

          SEEN=false
          if [ -n "$REL_TAG" ] && git rev-parse -q --verify "refs/tags/seen/$REL_TAG" >/dev/null; then
            SEEN=true
          fi

          # ---------- 2. 上游 master 有没有我们基线之后的新提交 ----------
          git remote add upstream "$UPSTREAM_REPO" 2>/dev/null || git remote set-url upstream "$UPSTREAM_REPO"
          git fetch --quiet upstream master || { echo "::error::拉取上游 master 失败"; exit 1; }
          NEW=$(git rev-parse upstream/master)
          BASE=$(sed -n 's/^base_full_sha=//p' patches/BASE)
          if [ -z "$BASE" ]; then
            echo "::error::patches/BASE 里读不到 base_full_sha"
            exit 1
          fi
          if git merge-base --is-ancestor "$NEW" "$BASE"; then
            CHANGED=false
          else
            CHANGED=true
          fi

          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"

          # ---------- 3. 结论 ----------
          if [ -z "$REL_TAG" ]; then
            echo "上游还没有正式 Release。"
            REL_NEW=false
          elif [ "$SEEN" = "true" ]; then
            echo "上游最新 Release 已处理过：$REL_TAG"
            REL_NEW=false
          else
            echo "上游有新 Release：$REL_TAG"
            REL_NEW=true
          fi
          echo "release_new=$REL_NEW" >> "$GITHUB_OUTPUT"
          [ "$CHANGED" = "true" ] \
            && echo "上游 master 也有新提交：$(git rev-parse --short "$BASE") → $(git rev-parse --short "$NEW")" \
            || echo "上游 master 相对基线没有新提交。"

          if [ "$REL_NEW" = "true" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "→ 本次编译出包。"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "→ 没有新 Release，跳过（不编译）。"
          fi

      - name: 准备要编译的代码
        id: apply
        if: steps.up.outputs.build == 'true'
        run: |
          set -uo pipefail
          if [ "${{ steps.up.outputs.changed }}" = "false" ]; then
            # 上游没变，当前分支就是最新代码，直接编
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "rebased=false" >> "$GITHUB_OUTPUT"
            echo "不需要叠补丁：当前分支已包含全部改动。"
            exit 0
          fi
          echo "rebased=true" >> "$GITHUB_OUTPUT"
          # patches/ 是我方分支上的文件，切到上游分支后会被删掉，先挪到临时目录
          cp -r patches /tmp/patches
          git switch -c "sync/${GITHUB_RUN_ID}" upstream/master
          if git am -3 --keep-cr /tmp/patches/series/*.patch; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            git submodule update --init --recursive
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            {
              echo "上游 \`${{ steps.up.outputs.new }}\` 动到了我方补丁改过的代码，自动合并失败。"
              echo ""
              echo "**冲突文件：**"
              git diff --name-only --diff-filter=U | sed 's/^/- `/;s/$/`/'
              echo ""
              echo "**在本地怎么修：**"
              echo '```bash'
              echo 'git fetch upstream master'
              echo 'bash fork-tools/sync-upstream.sh'
              echo 'bash fork-tools/make-patches.sh   # 修好后重新生成补丁'
              echo '```'
              echo ""
              echo "处理原则：import 冲突取并集；上游只是改名就取我方再批量改名；"
              echo "上游真重构了就取上游，再把 TV 逻辑补回去。"
            } > conflict-report.md
            # 贴到本次运行的摘要页（Run 页面最上方），失败原因一眼可见
            cat conflict-report.md >> "$GITHUB_STEP_SUMMARY"
            git am --abort || true
            exit 1
          fi

      - name: 给子模块打补丁
        if: steps.apply.outputs.ok == 'true'
        run: |
          set -euo pipefail
          # np-submodule/accompanist-lyrics-ui 里的 KaraokeLyricsView.kt 被我方改过
          # （加 linesInteractive 参数、亚像素滚动容差）。submodule 是别人的仓库，
          # 我们的改动推不上去，本地一直是「工作区裸文件」状态，CI 按 .gitmodules
          # 拉到的上游原版没有这些改动，app 模块调用 linesInteractive 就编译失败。
          # 这里用主仓库随带的整份文件覆盖回去。
          DEST=np-submodule/accompanist-lyrics-ui
          # 走 rebase 时工作区已经切到 upstream/master，本仓库的 patches/ 被删掉了，
          # apply 步骤开头曾把整份 patches 备份到 /tmp/patches。先把它搬回来（后面的
          # 「刷新补丁快照」要保留其中的 README.md 和 submodule/ 目录）。
          if [ ! -d patches ] && [ -d /tmp/patches ]; then
            cp -r /tmp/patches patches
            echo "已从 /tmp/patches 恢复 patches/ 目录"
          fi
          SRC=patches/submodule/accompanist-lyrics-ui
          test -d "$DEST" || { echo "::error::找不到子模块 $DEST，检查 checkout 的 submodules: recursive"; exit 1; }
          test -d "$SRC"  || { echo "::error::找不到 $SRC"; exit 1; }
          cp -r "$SRC"/. "$DEST"/
          TARGET="$DEST/src/src/commonMain/kotlin/com/mocharealm/accompanist/lyrics/ui/composable/lyrics/KaraokeLyricsView.kt"
          grep -q "linesInteractive" "$TARGET" \
            || { echo "::error::覆盖后 $TARGET 里仍然没有 linesInteractive"; exit 1; }
          echo "子模块已覆盖：$(basename "$TARGET")"

      - name: 刷新补丁快照（基线指向新上游）
        if: steps.apply.outputs.ok == 'true' && steps.apply.outputs.rebased == 'true'
        run: |
          set -euo pipefail
          bash fork-tools/make-patches.sh
          git add -A patches/
          if ! git diff --cached --quiet; then
            git commit -qm "chore: 同步上游 $(git rev-parse --short '${{ steps.up.outputs.new }}')，刷新补丁快照"
          fi

      - name: 安装 JDK 21
        if: steps.apply.outputs.ok == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Gradle 缓存
        if: steps.apply.outputs.ok == 'true'
        uses: gradle/actions/setup-gradle@v5

      - name: 安装 NDK
        if: steps.apply.outputs.ok == 'true'
        uses: ./.github/actions/android-ndk

      - name: 写入签名密钥
        if: steps.apply.outputs.ok == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.AERIAL_KEYSTORE_B64 }}
          STORE_PASS: ${{ secrets.AERIAL_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || { echo "::error::缺少 secret AERIAL_KEYSTORE_B64"; exit 1; }
          printf '%s' "$KEYSTORE_B64" | base64 -d > app/aerial.keystore
          # 密钥传错的话，包发出去也装不上（签名不一致），这里先验一遍。
          # 指纹是公开信息（不是秘密），直接写死，省得再配一个 secret。
          GOT=$(keytool -list -v -keystore app/aerial.keystore -storepass "$STORE_PASS" \
                  -alias "$KEY_ALIAS" 2>/dev/null \
                | sed -n 's/^[[:space:]]*SHA256: //p' | tr -d ':' | tr 'A-Z' 'a-z')
          WANT=$(printf '%s' "$CERT_SHA256" | tr -d ':' | tr 'A-Z' 'a-z')
          if [ "$GOT" != "$WANT" ]; then
            echo "::error::密钥库证书指纹不符，期望 $WANT 实际 $GOT"
            exit 1
          fi
          echo "密钥库指纹校验通过：$GOT"

      - name: 编译电视包
        if: steps.apply.outputs.ok == 'true'
        env:
          ORG_GRADLE_PROJECT_KEYSTORE_FILE: aerial.keystore
          ORG_GRADLE_PROJECT_KEYSTORE_PASSWORD: ${{ secrets.AERIAL_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_KEY_ALIAS: aerial
          ORG_GRADLE_PROJECT_KEY_PASSWORD: ${{ secrets.AERIAL_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew :app:assembleTvrelease --warning-mode all --stacktrace

      - name: 删掉临时密钥
        if: always()
        run: rm -f app/aerial.keystore

      - name: 整理产物并写发版说明
        id: meta
        if: steps.apply.outputs.ok == 'true'
        env:
          UPSTREAM_SHA: ${{ steps.up.outputs.new }}
          UPSTREAM_RELEASE: ${{ steps.up.outputs.release_tag }}
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/tvrelease/*.apk | head -1)
          test -n "$APK" || { echo "::error::没找到 tvrelease 的 APK"; exit 1; }
          cp "$APK" "$APK_OUT"
          VERSION=$(basename "$APK" | sed 's/^NeriPlayer-//; s/-armeabi-v7a.*//; s/\.apk$//')
          # tag 带月日时分，手动重复触发也不会撞车（同一个 tag 只能对应一次构建）
          TAG="tv-$(date -u +%Y%m%d-%H%M)-$(git rev-parse --short=7 "$UPSTREAM_SHA")"
          REL_NOTE=""
          if [ -n "${UPSTREAM_RELEASE:-}" ]; then
            REL_NOTE="，由上游 Release \`${UPSTREAM_RELEASE}\` 触发"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "upstream_short=$(git rev-parse --short=7 "$UPSTREAM_SHA")" >> "$GITHUB_OUTPUT"
          cat > release-notes.md <<EOF
          ## 这是什么

          **电视适配版** NeriPlayer（本 fork 的唯一用途），基于上游 \`${UPSTREAM_SHA}\` 构建${REL_NOTE}。

          - 包名 \`moe.ouom.neriplayer.tv\`（独立包名，可与手机版 / 调试版共存）
          - 签名：aerial
          - 只含 armeabi-v7a（这台电视是 32 位）
          - versionName \`${VERSION}\`
          - 构建变体 \`tvrelease\`（R8 混淆、不可调试，不是 debug 包）

          > 从旧的 \`moe.ouom.neriplayer.debug\` 升级：包名不同，两者会并存。
          > 先 \`adb uninstall moe.ouom.neriplayer.debug\` 再装，数据不会迁移。

          ## 与上游的差异

          修改日期 $(date -u +%Y-%m-%d)。完整改动见仓库内 \`patches/tv-fork.diff\`。主要改动：

          - TV 侧栏导航与遥控器焦点体系
          - 关闭部分动效 / 模糊 / 着色器，降低电视端负载
          - 歌词页、正在播放页的电视布局
          - 数据库启动时的 WAL 热日志恢复

          ## 源码

          与本次 APK 完全对应的源码：**本仓库 tag \`${TAG}\`**，对应提交
          \`$(git rev-parse HEAD)\`（GitHub 已自动为该 tag 提供 Source code 压缩包）。

          GitHub 的源码包**不包含子模块**。构建还需要下列子模块（仓库内 \`.gitmodules\` 有地址）：

          \`\`\`
          $(git submodule status --recursive | sed 's/^[ +-]*//' | awk '{printf "%s @ %s\n", $2, $1}')
          \`\`\`

          上游项目：https://github.com/cwuom/NeriPlayer

          ## 许可

          本程序为自由软件，按 **GNU General Public License v3.0 或更高版本**发布，
          不提供任何担保。许可证全文见仓库根目录 LICENSE，修改声明见 NOTICE。
          本构建不是上游官方发布，也不代表上游作者的观点。
          EOF

      - name: 校验产物的签名
        if: steps.apply.outputs.ok == 'true'
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BT=$(ls -d "$SDK"/build-tools/*/ | sort -V | tail -1)
          GOT=$("${BT}apksigner" verify --print-certs "$APK_OUT" \
                | grep -i 'SHA-256 digest' | head -1 | sed 's/.*digest: *//' \
                | tr -d ':' | tr 'A-Z' 'a-z')
          WANT=$(printf '%s' "$CERT_SHA256" | tr -d ':' | tr 'A-Z' 'a-z')
          if [ "$GOT" != "$WANT" ]; then
            echo "::error::APK 签名指纹不符：期望 $WANT 实际 $GOT（签名没生效？）"
            exit 1
          fi
          echo "APK 签名校验通过：$GOT"

      # 先推 main 再打 tag：这样 tag 指向的 commit 一定已经在远端，
      # 推送时只需传一个 tag 对象，不会因为「要连带推整条提交链」被拒。
      - name: 把同步结果推回 main
        if: steps.apply.outputs.ok == 'true' && steps.apply.outputs.rebased == 'true'
        run: |
          set -uo pipefail
          OUT=$(git push --force-with-lease origin "HEAD:main" 2>&1) || {
            { echo "### ❌ 推送 main 失败"; echo; echo '```'; echo "$OUT" | tail -30; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::推送 main 失败"; exit 1; }
          echo "$OUT"

      - name: 打 tag 并发布 Release
        if: steps.apply.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          UP_SHA: ${{ steps.up.outputs.new }}
        run: |
          set -uo pipefail

          # 任何一步失败都把真实报错贴到 Run 页面最上方，
          # 免得又只剩一句 "Process completed with exit code 1"。
          fail() {
            { echo "### ❌ $1"; echo; echo '```'; echo "${2:-（无输出）}" | tail -30; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::$1"
            exit 1
          }

          [ -n "${TAG:-}" ] || fail "meta 步骤没有产出 tag" "TAG 为空"
          echo "目标 tag：$TAG"
          echo "HEAD：$(git rev-parse HEAD)"
          echo "远端是否已有该 commit：$(git ls-remote origin "refs/heads/main" | grep -c "$(git rev-parse HEAD)" || true)"

          # 极端情况下（同一分钟重复触发）兜底加运行号，保证 tag 唯一
          EXIST=$(git ls-remote --tags origin "refs/tags/$TAG" 2>&1) || fail "查询远端 tag 失败" "$EXIST"
          if [ -n "$EXIST" ]; then
            TAG="${TAG}-r${GITHUB_RUN_NUMBER}"
            echo "同名 tag 已存在，改用 $TAG"
          fi

          OUT=$(git tag -a "$TAG" -m "基于上游 $UP_SHA 的电视适配构建" 2>&1) \
            || fail "创建 tag 失败" "$OUT"

          OUT=$(git push origin "$TAG" 2>&1) || fail "推送 tag 失败" "$OUT"
          echo "tag 已推送：$TAG"

          # --repo 必须显式指定：仓库里多了一个 upstream remote（指向上游 cwuom/NeriPlayer），
          # gh 推断默认仓库时会挑错，报「tag exists locally but has not been pushed to cwuom/...」
          OUT=$(gh release create "$TAG" "$APK_OUT" \
            --repo "${{ github.repository }}" \
            --title "TV 版 $TAG" \
            --notes-file release-notes.md 2>&1) \
            || fail "创建 Release 失败（tag $TAG 已在远端，可手动补建）" "$OUT"
          echo "Release 已发布：$TAG"

      # 放在最后：只有编译、验签、推 main、发版全部成功才打标记，
      # 中途失败的话下个小时还能重试，不会被误判成「已处理」。
      - name: 记录已处理的上游 Release
        if: steps.apply.outputs.ok == 'true' && steps.up.outputs.release_tag != ''
        run: |
          set -uo pipefail
          TAG="seen/${{ steps.up.outputs.release_tag }}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "标记 $TAG 已存在，无需重复打。"
            exit 0
          fi
          git tag "$TAG" HEAD
          OUT=$(git push origin "$TAG" 2>&1) || {
            echo "::error::推送标记 tag 失败"; echo "$OUT" | tail -20; exit 1; }
          echo "已标记：$TAG → $(git rev-parse --short=7 HEAD)"
          echo "下次定时任务看到这个标记就跳过，直到上游再发新 Release。"
