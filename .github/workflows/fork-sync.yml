name: 同步上游并发布电视版 / 手机版

# 干什么：
#   定时（每小时）去上游 cwuom/NeriPlayer 看**有没有发布新 Release**。
#   有新 Release → 在临时工作区里拉上游最新代码 → 先叠电视补丁编 TV 包，
#                再重置回上游叠手机补丁编手机包 → 两个包发到同一个 Release
#                → 打 seen/<上游 Release 名> 标记。
#   没有新 Release → 几秒退出，不编译。
#   手动触发（Run workflow）**总是出包**。
#
# ★ 这个工作流**从不推送任何 commit**，只推 tag（tag 指向 main 上已有的提交）。
#   上游代码只在临时工作区出现，不进本仓库历史，main 分支保持不动。
#   两套补丁互不影响：各自从同一个上游提交出发，分别 git am，编完再互相覆盖。
#
# 合规：GPLv3 §6 —— 二进制和对应源码从同一个地方提供。
#       两个 APK 各附一份 source.tar.gz（含全部子模块，解压即可编译）。

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write # 推 tag、建 Release

concurrency:
  group: fork-sync
  cancel-in-progress: false

env:
  UPSTREAM_REPO: https://github.com/cwuom/NeriPlayer.git
  UPSTREAM_API: https://api.github.com/repos/cwuom/NeriPlayer
  KEY_ALIAS: aerial
  APK_TV: NeriPlayer-tv-arm32-v7a.apk
  APK_MOBILE: NeriPlayer-Mobile-arm64-v8a.apk
  # aerial 证书的 SHA-256（公开信息，不是密钥）。传错密钥 / 没生效签名都会在这里失败。
  CERT_SHA256: 4ca292129ad97359a262d5f5269e7fd7ef0287b33cd19f6e761dd671946581b5

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90 # 两次编译，卡死时早失败
    permissions:
      contents: write # 打 tag、建 Release
    steps:
      - name: 拉取本仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 需要完整历史：git am -3 要用到补丁的原始 blob
          submodules: recursive

      - name: 配置 git 身份
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 检查上游有没有新 Release
        id: up
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # 记下 main 当前的 commit：tag 只打在这个已有的提交上。
          MAIN_SHA=$(git rev-parse HEAD)
          echo "main_sha=$MAIN_SHA" >> "$GITHUB_OUTPUT"

          # ---------- 1. 上游最新的正式 Release（忽略草稿和预发布）----------
          # 「已处理过」靠 tag 记：seen/<上游 Release 名>，整套流程跑完才打。
          REL_TAG=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "$UPSTREAM_API/releases?per_page=30" \
            | python3 -c 'import json,sys; rs=json.load(sys.stdin); print(next((r["tag_name"] for r in rs if not r.get("draft") and not r.get("prerelease")), ""))') \
            || { echo "::error::读取上游 Release 列表失败"; exit 1; }
          echo "release_tag=$REL_TAG" >> "$GITHUB_OUTPUT"

          git fetch --quiet origin '+refs/tags/seen/*:refs/tags/seen/*' 2>/dev/null || true

          SEEN=false
          if [ -n "$REL_TAG" ] && git rev-parse -q --verify "refs/tags/seen/$REL_TAG" >/dev/null; then
            SEEN=true
          fi

          # ---------- 2. 上游 master 最新的提交（编译用的就是它 + 补丁）----------
          git remote add upstream "$UPSTREAM_REPO" 2>/dev/null || git remote set-url upstream "$UPSTREAM_REPO"
          git fetch --quiet upstream master || { echo "::error::拉取上游 master 失败"; exit 1; }
          NEW=$(git rev-parse upstream/master)
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          echo "上游 master：$(git rev-parse --short "$NEW")"

          # ---------- 3. 结论 ----------
          if [ -z "$REL_TAG" ]; then
            echo "上游还没有正式 Release。"
            REL_NEW=false
          elif [ "$SEEN" = "true" ]; then
            echo "上游最新 Release 已处理过：$REL_TAG"
            REL_NEW=false
          else
            echo "上游有新 Release：$REL_TAG"
            REL_NEW=true
          fi
          echo "release_new=$REL_NEW" >> "$GITHUB_OUTPUT"

          if [ "$REL_NEW" = "true" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "→ 本次编译出包。"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "→ 没有新 Release，跳过（不编译）。"
          fi

      - name: 备份两套补丁
        if: steps.up.outputs.build == 'true'
        run: |
          set -euo pipefail
          # 切到上游提交后这些目录会被删掉，先挪到临时目录
          rm -rf /tmp/patches /tmp/patches-mobile
          cp -r patches /tmp/patches
          cp -r patches-mobile /tmp/patches-mobile

      - name: 切到上游代码并叠上电视补丁
        id: apply_tv
        if: steps.up.outputs.build == 'true'
        run: |
          set -uo pipefail

          git checkout --detach "${{ steps.up.outputs.new }}"
          git submodule update --init --recursive

          if git am -3 --keep-cr /tmp/patches/series/*.patch; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "电视补丁已叠上：$(git log --oneline -1)"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            {
              echo "### ❌ 电视补丁叠不到上游 \`${{ steps.up.outputs.new }}\` 上"
              echo ""
              echo "上游动到了我们改过的代码。冲突文件："
              echo ""
              git diff --name-only --diff-filter=U | sed 's/^/- `/;s/$/`/'
              echo ""
              echo "**在本地怎么修**（补丁基线往前走一次就行）："
              echo '```bash'
              echo 'bash fork-tools/sync-upstream.sh'
              echo 'bash fork-tools/make-patches.sh'
              echo 'git push origin main'
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            git am --abort || true
            exit 1
          fi

      - name: 给子模块打补丁（电视版）
        if: steps.apply_tv.outputs.ok == 'true'
        run: |
          set -euo pipefail
          # np-submodule/accompanist-lyrics-ui 里的 KaraokeLyricsView.kt 被电视补丁改过
          # （加 linesInteractive 参数、亚像素滚动容差），submodule 是别人的仓库推不上去，
          # 这里用备份里的整份文件覆盖回去。手机版不需要，下一步会重置。
          DEST=np-submodule/accompanist-lyrics-ui
          SRC=/tmp/patches/submodule/accompanist-lyrics-ui
          test -d "$DEST" || { echo "::error::找不到子模块 $DEST"; exit 1; }
          test -d "$SRC"  || { echo "::error::找不到 $SRC"; exit 1; }
          cp -r "$SRC"/. "$DEST"/
          TARGET="$DEST/src/src/commonMain/kotlin/com/mocharealm/accompanist/lyrics/ui/composable/lyrics/KaraokeLyricsView.kt"
          grep -q "linesInteractive" "$TARGET" \
            || { echo "::error::覆盖后 $TARGET 里仍然没有 linesInteractive"; exit 1; }
          echo "子模块已覆盖：$(basename "$TARGET")"

      - name: 安装 JDK 21
        if: steps.apply_tv.outputs.ok == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Gradle 缓存
        if: steps.apply_tv.outputs.ok == 'true'
        uses: gradle/actions/setup-gradle@v5

      - name: 安装 NDK
        if: steps.apply_tv.outputs.ok == 'true'
        uses: ./.github/actions/android-ndk

      - name: 写入签名密钥
        if: steps.apply_tv.outputs.ok == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.AERIAL_KEYSTORE_B64 }}
          STORE_PASS: ${{ secrets.AERIAL_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || { echo "::error::缺少 secret AERIAL_KEYSTORE_B64"; exit 1; }
          printf '%s' "$KEYSTORE_B64" | base64 -d > app/aerial.keystore
          GOT=$(keytool -list -v -keystore app/aerial.keystore -storepass "$STORE_PASS" \
                  -alias "$KEY_ALIAS" 2>/dev/null \
                | sed -n 's/^[[:space:]]*SHA256: //p' | tr -d ':' | tr 'A-Z' 'a-z')
          WANT=$(printf '%s' "$CERT_SHA256" | tr -d ':' | tr 'A-Z' 'a-z')
          if [ "$GOT" != "$WANT" ]; then
            echo "::error::密钥库证书指纹不符，期望 $WANT 实际 $GOT"
            exit 1
          fi
          echo "密钥库指纹校验通过：$GOT"

      - name: 编译电视包
        id: build_tv
        if: steps.apply_tv.outputs.ok == 'true'
        env:
          ORG_GRADLE_PROJECT_KEYSTORE_FILE: aerial.keystore
          ORG_GRADLE_PROJECT_KEYSTORE_PASSWORD: ${{ secrets.AERIAL_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_KEY_ALIAS: aerial
          ORG_GRADLE_PROJECT_KEY_PASSWORD: ${{ secrets.AERIAL_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # versionCode 和 tag 必须来自同一时刻（tag 里的 yyyyMMdd-HHmm 会被解析成 yyMMddHH
          # 再和 BuildConfig.VERSION_CODE 比大小）。两个包共用同一个时间戳，版本号也一致。
          BUILD_TS=$(date -u +%s%3N)
          BUILD_STAMP=$(date -u -d "@$((BUILD_TS / 1000))" +%Y%m%d-%H%M)
          echo "ts=$BUILD_TS" >> "$GITHUB_OUTPUT"
          echo "stamp=$BUILD_STAMP" >> "$GITHUB_OUTPUT"
          echo "构建时刻(UTC) $BUILD_STAMP"
          ./gradlew :app:assembleTvrelease -PbuildTimestamp="$BUILD_TS" --warning-mode all --stacktrace

      - name: 整理电视产物、打包电视源码
        id: meta_tv
        if: steps.apply_tv.outputs.ok == 'true'
        env:
          BUILD_STAMP: ${{ steps.build_tv.outputs.stamp }}
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/tvrelease/*.apk | head -1)
          test -n "$APK" || { echo "::error::没找到 tvrelease 的 APK"; exit 1; }
          cp "$APK" "$APK_TV"
          VERSION=$(basename "$APK" | sed 's/^NeriPlayer-//; s/-armeabi-v7a.*//; s/\.apk$//')
          SRC_OUT="NeriPlayer-TV-${BUILD_STAMP}-source.tar.gz"
          tar -czf "/tmp/$SRC_OUT" \
            --exclude='./.git' --exclude='./.gradle' \
            --exclude='./build' --exclude='*/build' --exclude='*/*/build' --exclude='*/*/*/build' \
            --exclude='*/.git' --exclude='./*.apk' --exclude='./*.tar.gz' \
            .
          mv "/tmp/$SRC_OUT" "./$SRC_OUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "src=$SRC_OUT" >> "$GITHUB_OUTPUT"
          echo "电视包：$APK_TV（versionName $VERSION）"

      - name: 重置到上游并叠上手机补丁
        id: apply_mobile
        if: steps.apply_tv.outputs.ok == 'true'
        run: |
          set -uo pipefail
          # 丢掉电视补丁和子模块覆盖，回到干净的上游
          git reset --hard "${{ steps.up.outputs.new }}"
          git submodule update --init --recursive --force

          if git am -3 --keep-cr /tmp/patches-mobile/series/*.patch; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "手机补丁已叠上：$(git log --oneline -1)"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            {
              echo "### ❌ 手机补丁叠不到上游 \`${{ steps.up.outputs.new }}\` 上"
              echo ""
              echo "冲突文件："
              echo ""
              git diff --name-only --diff-filter=U | sed 's/^/- `/;s/$/`/'
              echo ""
              echo "处理原则：按电视补丁同样的方式在本地重修一次基线，"
              echo "然后把 \`patches-mobile/\` 一起推上来。"
            } >> "$GITHUB_STEP_SUMMARY"
            git am --abort || true
            exit 1
          fi

      - name: 编译手机包
        id: build_mobile
        if: steps.apply_mobile.outputs.ok == 'true'
        env:
          ORG_GRADLE_PROJECT_KEYSTORE_FILE: aerial.keystore
          ORG_GRADLE_PROJECT_KEYSTORE_PASSWORD: ${{ secrets.AERIAL_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_KEY_ALIAS: aerial
          ORG_GRADLE_PROJECT_KEY_PASSWORD: ${{ secrets.AERIAL_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # 与电视包共用同一个 buildTimestamp：两个包的 versionCode 完全一致
          ./gradlew :app:assembleRelease \
            -PbuildTimestamp="${{ steps.build_tv.outputs.ts }}" \
            -PnativeAbis=arm64-v8a \
            --warning-mode all --stacktrace

      - name: 整理手机产物、打包手机源码
        id: meta_mobile
        if: steps.apply_mobile.outputs.ok == 'true'
        env:
          BUILD_STAMP: ${{ steps.build_tv.outputs.stamp }}
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          test -n "$APK" || { echo "::error::没找到 release 的 APK"; exit 1; }
          cp "$APK" "$APK_MOBILE"
          VERSION=$(basename "$APK" | sed 's/^NeriPlayer-//; s/-arm64-v8a.*//; s/\.apk$//')
          SRC_OUT="NeriPlayer-Mobile-${BUILD_STAMP}-source.tar.gz"
          tar -czf "/tmp/$SRC_OUT" \
            --exclude='./.git' --exclude='./.gradle' \
            --exclude='./build' --exclude='*/build' --exclude='*/*/build' --exclude='*/*/*/build' \
            --exclude='*/.git' --exclude='./*.apk' --exclude='./*.tar.gz' \
            .
          mv "/tmp/$SRC_OUT" "./$SRC_OUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "src=$SRC_OUT" >> "$GITHUB_OUTPUT"
          echo "手机包：$APK_MOBILE（versionName $VERSION）"

      - name: 删掉临时密钥
        if: always()
        run: rm -f app/aerial.keystore

      - name: 校验两个包的签名
        if: steps.apply_mobile.outputs.ok == 'true'
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BT=$(ls -d "$SDK"/build-tools/*/ | sort -V | tail -1)
          WANT=$(printf '%s' "$CERT_SHA256" | tr -d ':' | tr 'A-Z' 'a-z')
          for apk in "$APK_TV" "$APK_MOBILE"; do
            GOT=$("${BT}apksigner" verify --print-certs "$apk" \
                  | grep -i 'SHA-256 digest' | head -1 | sed 's/.*digest: *//' \
                  | tr -d ':' | tr 'A-Z' 'a-z')
            if [ "$GOT" != "$WANT" ]; then
              echo "::error::$apk 签名指纹不符：期望 $WANT 实际 $GOT"
              exit 1
            fi
            echo "$apk 签名校验通过"
          done

      - name: 写发版说明
        id: meta
        if: steps.apply_mobile.outputs.ok == 'true'
        env:
          UPSTREAM_SHA: ${{ steps.up.outputs.new }}
          UPSTREAM_RELEASE: ${{ steps.up.outputs.release_tag }}
          BUILD_STAMP: ${{ steps.build_tv.outputs.stamp }}
          VER_TV: ${{ steps.meta_tv.outputs.version }}
          VER_MOBILE: ${{ steps.meta_mobile.outputs.version }}
          SRC_TV: ${{ steps.meta_tv.outputs.src }}
          SRC_MOBILE: ${{ steps.meta_mobile.outputs.src }}
        run: |
          set -euo pipefail
          if [ -n "${BUILD_STAMP:-}" ]; then
            TAG="v-${BUILD_STAMP}"
          else
            TAG="v-$(date -u +%Y%m%d-%H%M)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          NOTE=""
          if [ -n "${UPSTREAM_RELEASE:-}" ]; then
            NOTE="，由上游 \`${UPSTREAM_RELEASE}\` 触发"
          fi

          cat > release-notes.md <<EOF
          ## 内容

          基于上游 \`${UPSTREAM_SHA}\` 构建${NOTE}。

          | 包 | 应用 ID | ABI | versionName |
          | --- | --- | --- | --- |
          | \`$APK_TV\`（电视版） | \`moe.ouom.neriplayer.tv\` | armeabi-v7a | \`${VER_TV}\` |
          | \`$APK_MOBILE\`（手机版） | \`moe.ouom.neriplayer\` | arm64-v8a | \`${VER_MOBILE}\` |

          两个包都用 aerial 证书签名，构建变体为 \`tvrelease\` / \`release\`（R8 混淆，非 debug 包）。

          ## 与上游的差异

          - 电视版：TV 侧栏与遥控器焦点、降负载渲染、电视版播放页/歌词布局。补丁见 \`patches/\`
          - 手机版：仅播放页「倍速与音调」与应用内检查更新。补丁见 \`patches-mobile/\`

          ## 源码

          \`${SRC_TV}\` / \`${SRC_MOBILE}\` 分别对应两个 APK，含全部子模块，
          解压后执行 \`./gradlew :app:assembleTvrelease\` / \`:app:assembleRelease\` 即可复现。

          上游项目：https://github.com/cwuom/NeriPlayer

          ## 许可

          按 **GPL-3.0-or-later** 发布，不提供任何担保。修改声明见 NOTICE。
          本构建不是上游官方发布，也不代表上游作者的观点。
          EOF

      - name: 打 tag 并发布 Release
        if: steps.apply_mobile.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          SRC_TV: ${{ steps.meta_tv.outputs.src }}
          SRC_MOBILE: ${{ steps.meta_mobile.outputs.src }}
          MAIN_SHA: ${{ steps.up.outputs.main_sha }}
        run: |
          set -uo pipefail

          fail() {
            { echo "### ❌ $1"; echo; echo '```'; echo "${2:-（无输出）}" | tail -30; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::$1"
            exit 1
          }

          [ -n "${TAG:-}" ] || fail "meta 步骤没有产出 tag" "TAG 为空"

          EXIST=$(git ls-remote --tags origin "refs/tags/$TAG" 2>&1) || fail "查询远端 tag 失败" "$EXIST"
          if [ -n "$EXIST" ]; then
            TAG="${TAG}-r${GITHUB_RUN_NUMBER}"
            echo "同名 tag 已存在，改用 $TAG"
          fi

          OUT=$(git tag -a "$TAG" "$MAIN_SHA" -m "基于上游 ${{ steps.up.outputs.new }} 的电视版 / 手机版构建" 2>&1) \
            || fail "创建 tag 失败" "$OUT"
          OUT=$(git push origin "$TAG" 2>&1) || fail "推送 tag 失败" "$OUT"
          echo "tag 已推送：$TAG → $MAIN_SHA"

          OUT=$(gh release create "$TAG" \
            "$APK_TV" "$SRC_TV" \
            "$APK_MOBILE" "$SRC_MOBILE" \
            --repo "${{ github.repository }}" \
            --title "电视版 / 手机版 $TAG" \
            --notes-file release-notes.md 2>&1) \
            || fail "创建 Release 失败（tag $TAG 已在远端，可手动补建）" "$OUT"
          echo "Release 已发布：$TAG"

      # 放在最后：只有全部成功才打标记，中途失败的话下个小时还能重试。
      - name: 记录已处理的上游 Release
        if: steps.apply_mobile.outputs.ok == 'true' && steps.up.outputs.release_tag != ''
        env:
          MAIN_SHA: ${{ steps.up.outputs.main_sha }}
        run: |
          set -uo pipefail
          TAG="seen/${{ steps.up.outputs.release_tag }}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "标记 $TAG 已存在，无需重复打。"
            exit 0
          fi
          git tag "$TAG" "$MAIN_SHA"
          OUT=$(git push origin "$TAG" 2>&1) || {
            echo "::error::推送标记 tag 失败"; echo "$OUT" | tail -20; exit 1; }
          echo "已标记：$TAG"
