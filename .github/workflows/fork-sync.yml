name: 同步上游并发布 TV 版

# 干什么：
#   定时（每小时）去上游 cwuom/NeriPlayer 看**有没有发布新 Release**。
#   有新 Release → 在临时工作区里拉上游最新代码 → 叠上我方补丁 → 编译
#                → 发 Release（APK + 源码包）→ 打 seen/<上游 Release 名> 标记。
#   没有新 Release → 几秒退出，不编译（上游 master 天天有提交也不管）。
#
#   手动触发（Run workflow）**总是出包**：不管有没有新 Release，都编一遍并发 Release。
#
# ★ 这个工作流**从不推送任何 commit**，只推 tag（tag 指向 main 上已有的提交）。
#   所以它不需要 workflows 权限，也能永远保持原样不被自己改写：
#   上游代码只在临时工作区出现，不进本仓库历史，main 分支保持不动。
#   补丁基线要往前走时，在本地跑一次 fork-tools/sync-upstream.sh（用你自己的凭据推）。
#
# 合规：GPLv3 §6 —— 二进制和对应源码从同一个地方提供。
#       所以 Release 里除了 APK，还附一份 source.tar.gz（含全部子模块，解压即可编译）。

on:
  schedule:
    # 每小时看一次上游 Release。没新 Release 时几秒就 exit，不编译，几乎零成本；
    # 跑得勤是为了对冲 GitHub schedule 的「best effort」——高峰期会延迟甚至整班跳过。
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write # 推 tag、建 Release

concurrency:
  group: fork-sync
  cancel-in-progress: false

env:
  UPSTREAM_REPO: https://github.com/cwuom/NeriPlayer.git
  UPSTREAM_API: https://api.github.com/repos/cwuom/NeriPlayer
  KEY_ALIAS: aerial
  APK_OUT: NeriPlayer-TV.apk
  # aerial 证书的 SHA-256（公开信息，不是密钥）。传错密钥 / 没生效签名都会在这里失败。
  CERT_SHA256: 4ca292129ad97359a262d5f5269e7fd7ef0287b33cd19f6e761dd671946581b5

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60 # 卡死时早失败，而不是拖到 GitHub 默认的 6 小时
    permissions:
      contents: write # 打 tag、建 Release
    steps:
      - name: 拉取本仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 需要完整历史：git am -3 要用到补丁的原始 blob
          submodules: recursive

      - name: 配置 git 身份
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 检查上游有没有新 Release
        id: up
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # 记下 main 当前的 commit：tag 只打在这个已有的提交上，
          # 推送时只有一个 tag 对象，不涉及任何提交内容。
          MAIN_SHA=$(git rev-parse HEAD)
          echo "main_sha=$MAIN_SHA" >> "$GITHUB_OUTPUT"

          # ---------- 1. 上游最新的正式 Release（忽略草稿和预发布）----------
          # 「已处理过」靠 tag 记：seen/<上游 Release 名>，整套流程跑完才打。
          REL_TAG=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "$UPSTREAM_API/releases?per_page=30" \
            | python3 -c 'import json,sys; rs=json.load(sys.stdin); print(next((r["tag_name"] for r in rs if not r.get("draft") and not r.get("prerelease")), ""))') \
            || { echo "::error::读取上游 Release 列表失败"; exit 1; }
          echo "release_tag=$REL_TAG" >> "$GITHUB_OUTPUT"

          # tag 可能没被 checkout 拉全（fetch-depth: 0 通常够，这里再兜一次）
          git fetch --quiet origin '+refs/tags/seen/*:refs/tags/seen/*' 2>/dev/null || true

          SEEN=false
          if [ -n "$REL_TAG" ] && git rev-parse -q --verify "refs/tags/seen/$REL_TAG" >/dev/null; then
            SEEN=true
          fi

          # ---------- 2. 上游 master 最新的提交（编译用的就是它 + 补丁）----------
          git remote add upstream "$UPSTREAM_REPO" 2>/dev/null || git remote set-url upstream "$UPSTREAM_REPO"
          git fetch --quiet upstream master || { echo "::error::拉取上游 master 失败"; exit 1; }
          NEW=$(git rev-parse upstream/master)
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          echo "上游 master：$(git rev-parse --short "$NEW")"

          # ---------- 3. 结论 ----------
          if [ -z "$REL_TAG" ]; then
            echo "上游还没有正式 Release。"
            REL_NEW=false
          elif [ "$SEEN" = "true" ]; then
            echo "上游最新 Release 已处理过：$REL_TAG"
            REL_NEW=false
          else
            echo "上游有新 Release：$REL_TAG"
            REL_NEW=true
          fi
          echo "release_new=$REL_NEW" >> "$GITHUB_OUTPUT"

          if [ "$REL_NEW" = "true" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "→ 本次编译出包。"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "→ 没有新 Release，跳过（不编译）。"
          fi

      - name: 切到上游代码并叠上补丁
        id: apply
        if: steps.up.outputs.build == 'true'
        run: |
          set -uo pipefail

          # patches/ 是本仓库的文件，切到上游提交后会被删掉，先挪到临时目录
          rm -rf /tmp/patches
          cp -r patches /tmp/patches

          # 切到上游最新提交（游离 HEAD，不会产生分支，也不会推任何东西）
          git checkout --detach "${{ steps.up.outputs.new }}"
          git submodule update --init --recursive

          if git am -3 --keep-cr /tmp/patches/series/*.patch; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "补丁已叠上：$(git log --oneline -1)"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            {
              echo "### ❌ 补丁叠不到上游 \`${{ steps.up.outputs.new }}\` 上"
              echo ""
              echo "上游动到了我们改过的代码。冲突文件："
              echo ""
              git diff --name-only --diff-filter=U | sed 's/^/- `/;s/$/`/'
              echo ""
              echo "**在本地怎么修**（补丁基线往前走一次就行）："
              echo '```bash'
              echo 'bash fork-tools/sync-upstream.sh'
              echo 'bash fork-tools/make-patches.sh'
              echo 'git push origin main'
              echo '```'
              echo ""
              echo "处理原则：import 冲突取并集；上游只是改名就取我方再批量改名；"
              echo "上游真重构了就取上游，再把 TV 逻辑补回去。"
            } >> "$GITHUB_STEP_SUMMARY"
            git am --abort || true
            exit 1
          fi

      - name: 给子模块打补丁
        if: steps.apply.outputs.ok == 'true'
        run: |
          set -euo pipefail
          # np-submodule/accompanist-lyrics-ui 里的 KaraokeLyricsView.kt 被我方改过
          # （加 linesInteractive 参数、亚像素滚动容差）。submodule 是别人的仓库，
          # 我们的改动推不上去，CI 按 .gitmodules 拉到的是上游原版，没有这些改动，
          # app 模块调用 linesInteractive 就会编译失败。这里用备份里的整份文件覆盖回去。
          DEST=np-submodule/accompanist-lyrics-ui
          SRC=/tmp/patches/submodule/accompanist-lyrics-ui
          test -d "$DEST" || { echo "::error::找不到子模块 $DEST，检查 checkout 的 submodules: recursive"; exit 1; }
          test -d "$SRC"  || { echo "::error::找不到 $SRC"; exit 1; }
          cp -r "$SRC"/. "$DEST"/
          TARGET="$DEST/src/src/commonMain/kotlin/com/mocharealm/accompanist/lyrics/ui/composable/lyrics/KaraokeLyricsView.kt"
          grep -q "linesInteractive" "$TARGET" \
            || { echo "::error::覆盖后 $TARGET 里仍然没有 linesInteractive"; exit 1; }
          echo "子模块已覆盖：$(basename "$TARGET")"

      - name: 安装 JDK 21
        if: steps.apply.outputs.ok == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Gradle 缓存
        if: steps.apply.outputs.ok == 'true'
        uses: gradle/actions/setup-gradle@v5

      - name: 安装 NDK
        if: steps.apply.outputs.ok == 'true'
        uses: ./.github/actions/android-ndk

      - name: 写入签名密钥
        if: steps.apply.outputs.ok == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.AERIAL_KEYSTORE_B64 }}
          STORE_PASS: ${{ secrets.AERIAL_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || { echo "::error::缺少 secret AERIAL_KEYSTORE_B64"; exit 1; }
          printf '%s' "$KEYSTORE_B64" | base64 -d > app/aerial.keystore
          # 密钥传错的话，包发出去也装不上（签名不一致），这里先验一遍。
          # 指纹是公开信息（不是秘密），直接写死，省得再配一个 secret。
          GOT=$(keytool -list -v -keystore app/aerial.keystore -storepass "$STORE_PASS" \
                  -alias "$KEY_ALIAS" 2>/dev/null \
                | sed -n 's/^[[:space:]]*SHA256: //p' | tr -d ':' | tr 'A-Z' 'a-z')
          WANT=$(printf '%s' "$CERT_SHA256" | tr -d ':' | tr 'A-Z' 'a-z')
          if [ "$GOT" != "$WANT" ]; then
            echo "::error::密钥库证书指纹不符，期望 $WANT 实际 $GOT"
            exit 1
          fi
          echo "密钥库指纹校验通过：$GOT"

      - name: 编译电视包
        if: steps.apply.outputs.ok == 'true'
        env:
          ORG_GRADLE_PROJECT_KEYSTORE_FILE: aerial.keystore
          ORG_GRADLE_PROJECT_KEYSTORE_PASSWORD: ${{ secrets.AERIAL_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_KEY_ALIAS: aerial
          ORG_GRADLE_PROJECT_KEY_PASSWORD: ${{ secrets.AERIAL_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew :app:assembleTvrelease --warning-mode all --stacktrace

      - name: 删掉临时密钥
        if: always()
        run: rm -f app/aerial.keystore

      - name: 整理产物、打包源码、写发版说明
        id: meta
        if: steps.apply.outputs.ok == 'true'
        env:
          UPSTREAM_SHA: ${{ steps.up.outputs.new }}
          UPSTREAM_RELEASE: ${{ steps.up.outputs.release_tag }}
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/tvrelease/*.apk | head -1)
          test -n "$APK" || { echo "::error::没找到 tvrelease 的 APK"; exit 1; }
          cp "$APK" "$APK_OUT"
          VERSION=$(basename "$APK" | sed 's/^NeriPlayer-//; s/-armeabi-v7a.*//; s/\.apk$//')
          # tag 带月日时分，手动重复触发也不会撞车（同一个 tag 只能对应一次构建）
          TAG="tv-$(date -u +%Y%m%d-%H%M)"
          SRC_OUT="NeriPlayer-TV-${TAG}-source.tar.gz"
          REL_NOTE=""
          if [ -n "${UPSTREAM_RELEASE:-}" ]; then
            REL_NOTE="，由上游 Release \`${UPSTREAM_RELEASE}\` 触发"
          fi

          # ---- 打包源码：当前工作区就是「上游 $UPSTREAM_SHA + 全部补丁」，
          #      子模块内容也在里面，解压即可编译（GPLv3 §6 要求的对应源码） ----
          # 输出必须写到 /tmp：直接写当前目录的话，tar 会读到正在增长的自己，
          # 报 "file changed as we read it" 并以 1 退出。打完再挪回来。
          tar -czf "/tmp/$SRC_OUT" \
            --exclude='./.git' \
            --exclude='./.gradle' \
            --exclude='./build' \
            --exclude='*/build' \
            --exclude='*/*/build' \
            --exclude='*/*/*/build' \
            --exclude='*/.git' \
            --exclude="./$APK_OUT" \
            .
          mv "/tmp/$SRC_OUT" "./$SRC_OUT"
          echo "源码包：$SRC_OUT ($(du -h "$SRC_OUT" | cut -f1))"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "src_out=$SRC_OUT" >> "$GITHUB_OUTPUT"

          cat > release-notes.md <<EOF
          ## 这是什么

          **电视适配版** NeriPlayer（本 fork 的唯一用途），基于上游 \`${UPSTREAM_SHA}\` 构建${REL_NOTE}。

          - 包名 \`moe.ouom.neriplayer.tv\`（独立包名，可与手机版 / 调试版共存）
          - 签名：aerial
          - 只含 armeabi-v7a（这台电视是 32 位）
          - versionName \`${VERSION}\`
          - 构建变体 \`tvrelease\`（R8 混淆、不可调试，不是 debug 包）

          > 从旧的 \`moe.ouom.neriplayer.debug\` 升级：包名不同，两者会并存。
          > 先 \`adb uninstall moe.ouom.neriplayer.debug\` 再装，数据不会迁移。

          ## 与上游的差异

          修改日期 $(date -u +%Y-%m-%d)。完整改动见仓库内 \`patches/tv-fork.diff\`。主要改动：

          - TV 侧栏导航与遥控器焦点体系
          - 关闭部分动效 / 模糊 / 着色器，降低电视端负载
          - 歌词页、正在播放页的电视布局
          - 数据库启动时的 WAL 热日志恢复

          ## 源码（重要）

          **本 Release 附带的 \`${SRC_OUT}\` 就是编出这个 APK 的完整源码**，
          已包含全部子模块，解压后执行 \`./gradlew :app:assembleTvrelease\` 即可复现。
          它对应上游 \`${UPSTREAM_SHA}\` 加上 \`patches/\` 里的电视适配改动。

          上游项目：https://github.com/cwuom/NeriPlayer

          ## 许可

          本程序为自由软件，按 **GNU General Public License v3.0 或更高版本**发布，
          不提供任何担保。许可证全文见源码包内 LICENSE，修改声明见 NOTICE。
          本构建不是上游官方发布，也不代表上游作者的观点。
          EOF

      - name: 校验产物的签名
        if: steps.apply.outputs.ok == 'true'
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BT=$(ls -d "$SDK"/build-tools/*/ | sort -V | tail -1)
          GOT=$("${BT}apksigner" verify --print-certs "$APK_OUT" \
                | grep -i 'SHA-256 digest' | head -1 | sed 's/.*digest: *//' \
                | tr -d ':' | tr 'A-Z' 'a-z')
          WANT=$(printf '%s' "$CERT_SHA256" | tr -d ':' | tr 'A-Z' 'a-z')
          if [ "$GOT" != "$WANT" ]; then
            echo "::error::APK 签名指纹不符：期望 $WANT 实际 $GOT（签名没生效？）"
            exit 1
          fi
          echo "APK 签名校验通过：$GOT"

      - name: 打 tag 并发布 Release
        if: steps.apply.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          SRC_OUT: ${{ steps.meta.outputs.src_out }}
          MAIN_SHA: ${{ steps.up.outputs.main_sha }}
        run: |
          set -uo pipefail

          # 任何一步失败都把真实报错贴到 Run 页面最上方，
          # 免得又只剩一句 "Process completed with exit code 1"。
          fail() {
            { echo "### ❌ $1"; echo; echo '```'; echo "${2:-（无输出）}" | tail -30; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::$1"
            exit 1
          }

          [ -n "${TAG:-}" ] || fail "meta 步骤没有产出 tag" "TAG 为空"

          # tag 打在 main 已有的提交上：这样 push 只传一个 tag 对象，
          # 不带任何提交内容，不会触发 workflows 权限检查。
          EXIST=$(git ls-remote --tags origin "refs/tags/$TAG" 2>&1) || fail "查询远端 tag 失败" "$EXIST"
          if [ -n "$EXIST" ]; then
            TAG="${TAG}-r${GITHUB_RUN_NUMBER}"
            echo "同名 tag 已存在，改用 $TAG"
          fi

          OUT=$(git tag -a "$TAG" "$MAIN_SHA" -m "基于上游 ${{ steps.up.outputs.new }} 的电视适配构建" 2>&1) \
            || fail "创建 tag 失败" "$OUT"
          OUT=$(git push origin "$TAG" 2>&1) || fail "推送 tag 失败" "$OUT"
          echo "tag 已推送：$TAG → $MAIN_SHA"

          # APK 和源码包一起发，GPLv3 §6 的「同一处提供对应源码」就满足了
          OUT=$(gh release create "$TAG" "$APK_OUT" "$SRC_OUT" \
            --repo "${{ github.repository }}" \
            --title "TV 版 $TAG" \
            --notes-file release-notes.md 2>&1) \
            || fail "创建 Release 失败（tag $TAG 已在远端，可手动补建）" "$OUT"
          echo "Release 已发布：$TAG"

      # 放在最后：只有编译、验签、发版全部成功才打标记，
      # 中途失败的话下个小时还能重试，不会被误判成「已处理」。
      - name: 记录已处理的上游 Release
        if: steps.apply.outputs.ok == 'true' && steps.up.outputs.release_tag != ''
        env:
          MAIN_SHA: ${{ steps.up.outputs.main_sha }}
        run: |
          set -uo pipefail
          TAG="seen/${{ steps.up.outputs.release_tag }}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "标记 $TAG 已存在，无需重复打。"
            exit 0
          fi
          git tag "$TAG" "$MAIN_SHA"
          OUT=$(git push origin "$TAG" 2>&1) || {
            echo "::error::推送标记 tag 失败"; echo "$OUT" | tail -20; exit 1; }
          echo "已标记：$TAG → $(git rev-parse --short=7 "$MAIN_SHA")"
          echo "下次定时任务看到这个标记就跳过，直到上游再发新 Release。"
